name: EcoCI carbon-aware tests

# Runs on GitHub-hosted Ubuntu runners. This is NOT the Phase 5 Linux work:
# no RAPL counters are read here, energy is a TDP estimate and is labelled as
# such. Phase 5 swaps in a self-hosted runner with hardware counters.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  ecoci-decide-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the demo app and EcoCI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest
          # EcoCI itself. Point this at your fork/branch or a published wheel.
          python -m pip install "ecoci @ git+https://github.com/${{ github.repository_owner }}/ecoci-control-plane.git" || echo "EcoCI package not published yet; using API-only mode"

      - name: Compute the real changed-file list
        id: diff
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          git diff --numstat "$BASE" "$HEAD" > changed.txt || true
          python - <<'PY' > pr.json
          import json, os
          files = []
          with open("changed.txt", encoding="utf-8") as fh:
              for line in fh:
                  cols = line.strip().split("\t")
                  if len(cols) != 3:
                      continue
                  add, dele, path = cols
                  files.append({
                      "path": path,
                      "status": "modified",
                      "additions": int(add) if add.isdigit() else 0,
                      "deletions": int(dele) if dele.isdigit() else 0,
                  })
          event = json.load(open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8"))
          pr = event.get("pull_request", {})
          print(json.dumps({
              "repo": event["repository"]["full_name"],
              "number": pr.get("number", 0),
              "title": pr.get("title", ""),
              "body": (pr.get("body") or "")[:4000],
              "author": (pr.get("user") or {}).get("login", ""),
              "labels": [l["name"] for l in pr.get("labels", [])],
              "base_sha": (pr.get("base") or {}).get("sha", ""),
              "head_sha": (pr.get("head") or {}).get("sha", ""),
              "files": files,
          }))
          PY
          echo "changed=$(wc -l < changed.txt)" >> "$GITHUB_OUTPUT"

      - name: Resolve EcoCI control-plane URL
        id: url
        env:
          ECOCI_URL: ${{ vars.ECOCI_URL }}
        run: |
          if [ -z "$ECOCI_URL" ] && [ -f .github/ecoci-url.txt ]; then
            ECOCI_URL="$(tr -d '\r\n ' < .github/ecoci-url.txt)"
            echo "using URL from .github/ecoci-url.txt"
          fi
          if [ -z "$ECOCI_URL" ]; then
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "ECOCI_URL not configured; the suite will run in full"
          else
            echo "present=yes" >> "$GITHUB_OUTPUT"
            echo "ECOCI_URL=$ECOCI_URL" >> "$GITHUB_ENV"
          fi

      - name: Ask EcoCI what to run
        id: ecoci
        if: steps.url.outputs.present == 'yes'
        run: |
          curl -sS -X POST "$ECOCI_URL/v1/webhooks/local" \
            -H 'Content-Type: application/json' \
            --data @pr.json > decision.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("decision.json", encoding="utf-8"))
          selected = d.get("tests_selected") or []
          with open("selected.txt", "w", encoding="utf-8") as fh:
              fh.write("\n".join(selected))
          print(f"mode={'subset' if selected else 'full'}")
          print(f"action={d.get('action')}")
          print(f"saving={d.get('carbon_saving_pct', 0):.1f}")
          PY
          python -c "import json;print(json.load(open('decision.json'))['comment_markdown'])" > comment.md
        env:
          ECOCI_URL: ${{ env.ECOCI_URL }}

      - name: Default to the full suite when EcoCI is unreachable
        if: steps.url.outputs.present != 'yes'
        run: echo "mode=full" >> "$GITHUB_OUTPUT"
        id: fallback

      - name: Run the selected tests with energy measurement
        run: |
          MODE="${{ steps.ecoci.outputs.mode }}"
          if [ -z "$MODE" ]; then MODE=full; fi
          PLUGIN=()
          if python -c "import ecoci.pytest_plugin" 2>/dev/null; then
            PLUGIN=(-p ecoci.pytest_plugin --ecoci-report ecoci_report.json)
          fi
          if [ "$MODE" = "subset" ] && [ -s selected.txt ]; then
            python -m pytest "${PLUGIN[@]}" --ecoci-select selected.txt -q || python -m pytest -q --tb=short $(cat selected.txt)
          else
            python -m pytest "${PLUGIN[@]}" -q || python -m pytest -q --tb=short
          fi

      - name: Report measurements back to EcoCI
        if: always() && hashFiles('decision.json') != '' && hashFiles('ecoci_report.json') != ''
        run: |
          python - <<'PY'
          import json, os, urllib.request
          report = json.load(open("ecoci_report.json", encoding="utf-8"))
          decision = json.load(open("decision.json", encoding="utf-8"))
          payload = {
              "run_id": decision["run_id"],
              "duration_s": report["duration_s"],
              "kwh": report["kwh"],
              "energy_source": report["energy_source"],
              "test_results": [
                  {k: t[k] for k in ("node_id", "status", "duration_s", "selected", "executed")}
                  for t in report["test_results"]
              ],
          }
          req = urllib.request.Request(
              os.environ["ECOCI_URL"] + "/v1/telemetry/finalize",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          print(urllib.request.urlopen(req, timeout=30).read().decode())
          PY
        env:
          ECOCI_URL: ${{ env.ECOCI_URL }}

      - name: Comment the decision on the pull request
        if: always() && hashFiles('comment.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
