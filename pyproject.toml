[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shop"
version = "0.1.0"
description = "Demo application used to evaluate the EcoCI carbon-aware pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: minimal always-run subset; EcoCI never skips these",
    "security: security-relevant; EcoCI never skips these",
]
